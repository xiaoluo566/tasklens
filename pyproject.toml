[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-harness"
version = "0.1.9"
description = "Single-agent AI browser testing, observability, and failure analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "automation", "browser", "cdp", "chrome", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "cdp-use==1.4.5",
    "fetch-use==0.4.0",
    "fastapi>=0.115,<1",
    "pillow==12.3.0",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
    "websockets==15.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[project.scripts]
browser-harness = "browser_harness.run:main"
tasklens = "browser_harness.tasklens_cli:main"

[project.urls]
Homepage = "https://github.com/xiaoluo566/tasklens"
Repository = "https://github.com/xiaoluo566/tasklens"
Issues = "https://github.com/xiaoluo566/tasklens/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browser_harness = ["SKILL.md", "video-template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
